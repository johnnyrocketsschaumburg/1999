<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scraper Results</title>
</head>

<body>
  <h1>Scraper Results</h1>
  <div id="results">Loading...</div>

  <script>
    fetch("results.json")
      .then(response => response.json())
      .then(data => {
        document.getElementById("results").innerHTML =
          data.map(item => `
            <p>
              <a href="${item.url}" target="_blank">
                ${item.title}
              </a>
            </p>
          `).join("");
      });
  </script>
</body>
</html></body>
</html>
